const BL=[{n:'Tadımcı',x:0,r:['Hoş geldin kuponu','Temel rozetler']},{n:'Lezzet Avcısı',x:500,r:['%5 sürpriz kupon','Öncelikli destek']},{n:'Gurme',x:1500,r:['Ayda 2 ücretsiz kurye','Yeni üreticilere erken erişim']},{n:'Usta Gurme',x:3500,r:['Her siparişte 2 kat XP','Özel etkinlik davetleri']}];
const lvOf=x=>{let k=0;BL.forEach((l,i)=>{if(x>=l.x)k=i});return k};
const ini=()=>ST.pr.name.split(' ').map(w=>w[0]).slice(0,2).join('').toLocaleUpperCase('tr');
const mask=p=>'•••• ••• •• '+p.slice(-2);
const thumb=(n,s)=>{const i=SL[s].p.findIndex(p=>p.n==n);return'data:image/jpeg;base64,'+(i>=0?IMG[SL[s].ph+i]:IMG[SL[s].av])};
const s5=n=>`<span class="s5" role="img" aria-label="${n} yıldız">${[1,2,3,4,5].map(k=>`<i class="${k<=n?'on':''}">★</i>`).join('')}</span>`;
const pend=()=>{const a=[];ST.orders.filter(o=>o.st==3).forEach(o=>o.it.forEach(t=>{if(!ST.rv.some(r=>r.p==t.n)&&!a.some(x=>x.p==t.n))a.push({p:t.n,s:o.s})}));return a};
const rw=(at,i,t,s='',x='',cls='')=>`<button class="rw ${cls}" ${at}><span class="ri">${ic(I[i],20)}</span><span class="rt2"><b>${t}</b>${s?`<small>${s}</small>`:''}</span>${x}<span class="ch">${ic(I.chev,18)}</span></button>`;
const rb=n=>n?`<em class="rb">${n}</em>`:'';
const pgs=(k,n)=>{const nx=BL[k+1];return nx?Math.round((n-BL[k].x)/(nx.x-BL[k].x)*100):100};
V.prof=()=>{const x=ST.xp,k=lvOf(x),n=BL[k+1],act=ST.orders.map((o,i)=>[o,i]).find(a=>a[0].st>=0&&a[0].st<3),pd=pend(),off=ST.cu.filter(c=>c.st=='offer'||c.st=='pay').length,actN=ST.orders.filter(o=>o.st>=0&&o.st<3).length;
 return{p:'L',sm:1,c:'mkv',h:`<div class="bar"><h2>Profil</h2><button class="ic" data-go="set" aria-label="Ayarlar" style="margin-left:auto">${ic(I.gear)}</button></div><div class="mb"><section class="pfh"><span class="pa big">${ini()}</span><div><h1>${ST.pr.name}</h1><p>${ST.since||'Üye · Temmuz 2026'}</p></div><button class="pbtn" data-a="ed:name">Düzenle</button></section>
<button class="lvh" data-go="exp">${medal(k,44)}<div><small>Seviye ${k+1} / ${BL.length}</small><b>${BL[k].n}</b><div class="xb"><i style="width:${pgs(k,x)}%"></i></div><small>${n?`${n.x-x} XP sonra ${n.n}`:'En üst seviyedesin'}</small></div><span class="ch">${ic(I.chev,18)}</span></button>
${act?`<button class="act2" data-go="ord:${act[1]}"><i class="dot"></i><div style="flex:1;text-align:left"><b>${ost(act[0])}</b><small>${SL[act[0].s].n} · ${act[0].eta}</small></div><span class="ch">${ic(I.chev,18)}</span></button>`:''}
<div class="mst"><div><b>${ST.orders.length}</b><small>Sipariş</small></div><div><b>${ST.rv.length}</b><small>Yorum</small></div><div><b>${new Set(ST.orders.map(o=>o.s)).size}</b><small>Üretici</small></div></div>
${pd.length?`<button class="nudge" data-go="rev"><img class="th" alt="" src="${thumb(pd[0].p,pd[0].s)}"><div style="flex:1;text-align:left"><b>${pd.length} ürün yorumunu bekliyor</b><small>Yorum yaz, 10 XP kazan</small></div><span class="ch">${ic(I.chev,18)}</span></button>`:''}
<h4 class="gh">Hesabım</h4><div class="grp">${rw('data-go="orders"','rc','Siparişlerim','Devam eden ve geçmiş',rb(actN))}${rw('data-go="cu"','sp','Özel siparişlerim','Taleplerin ve teklifler',rb(off))}${rw('data-go="rev"','star','Yorumlarım',ST.rv.length+' yorum',rb(pd.length))}${rw('data-go="exp"','award','Deneyim','Seviye ve ödüller')}</div>
<h4 class="gh">Tercihler</h4><div class="grp">${rw('data-go="adr"','pin','Konum ve adreslerim',ST.ad.length+' kayıtlı adres')}${rw('data-go="set"','gear','Ayarlar','Hesap, bildirim, güvenlik')}</div>
<h4 class="gh">Yardım</h4><div class="grp">${rw('data-go="sup"','help','Destek','Taleplerin ve yardım merkezi',ST.tk.length?rb(ST.tk.length):'')}${rw('data-toast="Satıcı paneli bu demoda yok"','swap','Satıcı hesabına geç','Hesaplar arasında geçiş')}</div>
<div class="grp">${rw('data-go="land"','out','Çıkış yap','Demoyu baştan başlatır','','dg')}</div></div>${nav(3)}${ovl()}`}};
V.exp=()=>{const x=ST.xp,k=lvOf(x),n=BL[k+1];
 return{p:'L',sm:1,c:'mkv',h:`${hdr('prof','Deneyim','<span class="ex" style="margin-left:auto">Örnek değerler</span>')}<div class="mb"><section class="lh">${medal(k,64)}<div><small>Seviye ${k+1} / ${BL.length}</small><h1>${BL[k].n}</h1></div></section><div class="xp"><div class="xb"><i style="width:${pgs(k,x)}%"></i></div><p><b>${x}${n?' / '+n.x.toLocaleString('tr-TR'):''} XP</b>${n?' · '+n.n+' seviyesine '+(n.x-x)+' XP kaldı':''}</p></div>${n?`<div class="okb pkb">${ic(I.gift,22)}<div><b>Sıradaki ödül</b><small>${n.r.join(' · ')}</small></div></div>`:''}<h2 class="h2">Seviyeler</h2><div class="lad">${BL.map((l,i)=>`<div class="lr${i==k?' cu':''}${i>k?' lk':''}">${medal(i,36)}<div><b>${l.n}${i==k?' · Şu an':''}</b><small>${l.x.toLocaleString('tr-TR')} XP</small><small>${l.r.join(' · ')}</small></div></div>`).join('')}</div><h2 class="h2">XP nasıl kazanılır</h2><div class="xr">${[['Tamamlanan sipariş','+25'],['Ürün yorumu','+10'],['Fotoğraflı yorum','+15'],['Arkadaşını davet et','+50']].map(r=>`<div><span>${r[0]}</span><b>${r[1]} XP</b></div>`).join('')}</div></div>${nav(3)}${ovl()}`}};
V.rev=()=>{const pd=pend();
 return{p:'L',sm:1,c:'mkv',h:`${hdr('prof','Yorumlarım')}<div class="mb">${pd.length?`<h4 class="gh">Yorum bekleyenler · +10 XP</h4><div class="grp">${pd.map((p,i)=>`<div class="rw2"><img class="th" alt="" src="${thumb(p.p,p.s)}"><span class="rt2"><b>${p.p}</b><small>${SL[p.s].n}</small></span><button class="pbtn" data-a="rvw:${i}">Yorum yaz</button></div>`).join('')}</div>`:''}<h4 class="gh">Yazdıkların · ${ST.rv.length}</h4>${ST.rv.length?ST.rv.map((r,i)=>`<section class="cd"><div class="adh"><img class="th" alt="" src="${thumb(r.p,r.s)}"><div><b>${r.p}</b><p>${SL[r.s].n}</p>${s5(r.r)}</div>${pill('Doğrulanmış alıcı','gr')}</div>${r.x?`<p class="sub" style="margin:0;color:var(--ink)">${r.x}</p>`:''}${r.tg&&r.tg.length?`<div class="tgs">${r.tg.map(t=>`<span>${t}</span>`).join('')}</div>`:''}<p class="hint" style="margin:0">${r.d}${r.h?' · '+r.h+' kişi faydalı buldu':''}</p><div class="acts"><button data-a="rve:${i}">Düzenle</button><button class="dg" data-a="rvx:${i}">Sil</button></div></section>`).join(''):emp('Henüz yorum yazmadın','Teslim aldığın ürünler için yorum yazabilirsin.')}</div>${nav(3)}${ovl()}`}};
const adc=(a,i)=>`<section class="cd"><div class="adh"><span class="ri">${ic(I[a.t=='Ev'?'home':a.t=='İş'?'work':'pin'],20)}</span><div><b>${a.t}</b><p>${a.l1}</p><p>${a.ds}, ${a.il}</p></div>${a.def?pill('Varsayılan','gr'):''}</div><div class="acts">${a.def?'':`<button data-a="addef:${i}">Varsayılan</button>`}<button data-a="ade:${i}">Düzenle</button><button class="dg" data-a="adx:${i}">Sil</button></div></section>`;
V.adr=()=>({p:'L',sm:1,c:'mkv',h:`${hdr('prof','Konum ve adresler')}<div class="mb"><h4 class="gh">Mağaza konumu</h4><div class="cd"><div class="adh"><span class="ri">${ic(I.pin,20)}</span><div><b>${ST.loc||'Konum seçilmedi'}</b><p>Üreticileri bu konuma göre listeliyoruz</p></div></div><button class="btn out" data-go="loc">Mağaza konumunu değiştir</button></div><h4 class="gh">Teslimat adreslerim</h4>${ST.ad.length?ST.ad.map(adc).join(''):emp('Kayıtlı adres yok','Siparişlerinde hızlıca kullanmak için adres ekle.')}<button class="btn main" data-a="adn">${ic(I.plus,18)}Yeni adres ekle</button></div>${nav(3)}${ovl()}`});
V.set=()=>{const s=ST.set,sw=(k,t,sub)=>`<div class="rw"><span class="rt2"><b>${t}</b>${sub?`<small>${sub}</small>`:''}</span><button class="sw" role="switch" aria-checked="${!!s[k]}" aria-label="${t}" data-a="sw:${k}"></button></div>`,lk=(k,n,ico)=>`<div class="rw"><span class="ri" style="background:#fff;border:1.5px solid var(--line)">${ico}</span><span class="rt2"><b>${n}</b><small>${ST.lk[k]?'Bağlı':'Bağlı değil'}</small></span><button class="pbtn" data-a="lk:${k}">${ST.lk[k]?'Kaldır':'Bağla'}</button></div>`;
 return{p:'L',sm:1,c:'mkv',h:`${hdr('prof','Ayarlar')}<div class="mb"><h4 class="gh">Hesap</h4><div class="grp">${rw('data-a="ed:name"','us','Ad Soyad',ST.pr.name)}${rw('data-a="ed:email"','mail','E-posta',ST.pr.email||'Eklenmedi')}${rw('data-a="ed:phone"','phone','Telefon',mask(ST.pr.phone))}</div>
<h4 class="gh">Bildirimler</h4><div class="grp">${sw('ord','Sipariş güncellemeleri','Hazırlanıyor, yolda, teslim edildi')}${sw('cust','Özel sipariş teklifleri','Üretici teklif verdiğinde')}${sw('camp','Kampanyalar ve kuponlar','')}</div>
<h4 class="gh">Bildirim kanalları</h4><div class="grp">${sw('push','Push bildirimleri','')}${sw('sms','SMS','')}${sw('mail','E-posta','')}</div>
<h4 class="gh">Güvenlik</h4><div class="grp">${rw('data-a="pw"','lock','Şifreyi değiştir','Son değişiklik: 9 Temmuz 2026')}${sw('tfa','İki aşamalı doğrulama','Girişte SMS kodu iste')}</div>
<h4 class="gh">Bağlı hesaplar</h4><div class="grp">${lk('google','Google',gIco)}${lk('apple','Apple',aIco)}</div>
<h4 class="gh">Genel</h4><div class="grp">${rw('data-toast="Şimdilik yalnızca Türkçe"','globe','Dil','Türkçe')}${rw('data-a="dl"','trash','Hesabımı sil','Bu işlem geri alınamaz','','dg')}</div><p class="hint" style="text-align:center">Bitatlım · demo sürümü</p></div>${nav(3)}${ovl()}`}};
const hd2=t=>`<div class="gr"></div><div class="fh"><h2>${t}</h2><button class="ic" data-close aria-label="Kapat">${ic(I.x)}</button></div>`;
const EDL={name:['Ad Soyad','text'],email:['E-posta','email'],phone:['Telefon','tel']};
const shEd=k=>`${hd2(EDL[k][0]+' düzenle')}<label class="f"><span>${EDL[k][0]}</span><input id="edv" type="${EDL[k][1]}" value="${ST.pr[k]}" autocomplete="off"></label>${k=='email'?'<p class="hint" style="margin:0">Yeni adresine doğrulama bağlantısı göndeririz.</p>':''}<button class="btn main" data-a="edsv">Kaydet</button>`;
const shPw=()=>`${hd2('Şifreyi değiştir')}${['Mevcut şifre:pw0','Yeni şifre (en az 8 karakter):pw1','Yeni şifre (tekrar):pw2'].map(x=>{const[l,id]=x.split(':');return`<label class="f"><span>${l}</span><input id="${id}" type="password" autocomplete="off"></label>`}).join('')}<p class="hint" id="pwh" style="margin:0"></p><button class="btn main" data-a="pwsv" disabled>Şifreyi güncelle</button>`;
const shDl=()=>`<div class="gr"></div><h2>Hesabın silinsin mi?</h2><p class="sub" style="margin:0">Siparişlerin, yorumların ve XP’n kalıcı olarak silinir. Bu işlem geri alınamaz.</p><button class="btn main" style="background:#B3261E;box-shadow:none" data-a="dlok">Hesabımı sil</button><button class="btn out" data-close>Vazgeç</button>`;
const shCn=(t,m,lbl,act)=>`<div class="gr"></div><h2>${t}</h2><p class="sub" style="margin:0">${m}</p><button class="btn main" style="background:#B3261E;box-shadow:none" data-a="${act}">${lbl}</button><button class="btn out" data-close>Vazgeç</button>`;
const shRv=()=>{const d=ST.rd;return`${hd2(d.i>=0?'Yorumu düzenle':'Yorum yaz')}<div class="rw2" style="padding:0"><img class="th" alt="" src="${thumb(d.p,d.s)}"><span class="rt2"><b>${d.p}</b><small>${SL[d.s].n}</small></span></div><div class="stars" id="stv">${[1,2,3,4,5].map(n=>`<button data-a="star:${n}" aria-label="${n} yıldız" class="${n<=d.r?'on':''}">★</button>`).join('')}</div><div class="chips mul">${['Taze','Doğru porsiyon','Güzel paketleme','Zamanında'].map(x=>`<button class="chip" data-chip aria-pressed="${(d.tg||[]).includes(x)}">${x}</button>`).join('')}</div><label class="f"><textarea id="rvx" rows="3" maxlength="500" placeholder="Lezzet, porsiyon, paketleme… Nasıldı?">${d.x||''}</textarea></label><button class="up" data-a="photo">${ic(I.camera,18)}Fotoğraf ekle</button><button class="btn main" data-a="rvsv" ${d.r?'':'disabled'}>Yorumu yayınla</button>`};
const shAd=()=>{const d=ST.ed2;return`${hd2(d.i>=0?'Adresi düzenle':'Yeni adres')}<div class="fb"><div class="chips one">${['Ev','İş','Diğer'].map(x=>`<button class="chip" data-chip aria-pressed="${d.t==x}">${x}</button>`).join('')}</div><button class="btn loc" data-a="adloc">${ic(I.pin,20)}Konumumu kullan</button><div class="tw"><label class="f"><span>İl</span><input id="ail" value="${d.il}"></label><label class="f"><span>İlçe *</span><input id="aid" value="${d.ds}"></label></div><label class="f"><span>Açık adres *</span><input id="ai1" value="${d.l1}" placeholder="Mahalle, sokak, bina ve daire no"></label></div><button class="btn main" data-a="adsv" ${d.ds&&d.l1?'':'disabled'}>Adresi kaydet</button>`};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const[a,v]=t.dataset.a.split(':'),g=s=>sheet.querySelector(s),cl=()=>g('.mkv').classList.remove('open','nfo','gso');
 if(a=='ed'){ST.ed=v;openGS(shEd(v))}
 else if(a=='edsv'){const x=g('#edv').value.trim();if(!x)return;ST.pr[ST.ed]=x;cl();rr();toast('Güncellendi')}
 else if(a=='pw')openGS(shPw());
 else if(a=='pwsv'){cl();toast('Şifren güncellendi')}
 else if(a=='sw'){ST.set[v]=ST.set[v]?0:1;rr()}
 else if(a=='lk'){ST.lk[v]=ST.lk[v]?0:1;rr();toast(ST.lk[v]?'Hesap bağlandı':'Bağlantı kaldırıldı')}
 else if(a=='dl')openGS(shDl());
 else if(a=='dlok'){cl();toast('Demoda hesap silinmez')}
 else if(a=='adn'){ST.ed2={i:-1,t:'Ev',l1:'',ds:'',il:'İstanbul'};openGS(shAd())}
 else if(a=='ade'){ST.ed2={i:+v,...ST.ad[+v]};openGS(shAd())}
 else if(a=='adx')openGS(shCn('Adres silinsin mi?',ST.ad[+v].t+' · '+ST.ad[+v].l1,'Adresi sil','adxo:'+v));
 else if(a=='adxo'){const w=ST.ad[+v].def;ST.ad.splice(+v,1);if(w&&ST.ad[0])ST.ad[0].def=1;cl();rr();toast('Adres silindi')}
 else if(a=='addef'){ST.ad.forEach((x,i)=>x.def=i==+v?1:0);rr();toast('Varsayılan adres güncellendi')}
 else if(a=='adloc'){g('#aid').value='Kadıköy';g('#ai1').value='Moda Cd. No:12 D:3';g('#aid').dispatchEvent(new Event('input',{bubbles:true}))}
 else if(a=='adsv'){const d=ST.ed2,t2=g('.gs .chip[aria-pressed=true]'),o={t:t2?t2.textContent:'Diğer',l1:g('#ai1').value.trim(),ds:g('#aid').value.trim(),il:g('#ail').value.trim()||'İstanbul',def:d.i>=0?ST.ad[d.i].def:(ST.ad.length?0:1)};if(!o.l1||!o.ds)return;d.i>=0?ST.ad[d.i]=o:ST.ad.push(o);cl();rr();toast('Adres kaydedildi')}
 else if(a=='rvw'){const p=pend()[+v];ST.rd={i:-1,p:p.p,s:p.s,r:0,x:'',tg:[]};openGS(shRv())}
 else if(a=='rve'){ST.rd={...ST.rv[+v],i:+v};openGS(shRv())}
 else if(a=='rvx')openGS(shCn('Yorum silinsin mi?',ST.rv[+v].p+' için yazdığın yorum kaldırılacak.','Yorumu sil','rvxo:'+v));
 else if(a=='rvxo'){ST.rv.splice(+v,1);cl();rr();toast('Yorum silindi')}
 else if(a=='star'){ST.rd.r=+v;g('#stv').querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i<+v));g('[data-a="rvsv"]').disabled=false}
 else if(a=='photo'){t.classList.toggle('on');t.lastChild.textContent=t.classList.contains('on')?' Fotoğraf eklendi (demo) · +5 XP':' Fotoğraf ekle'}
 else if(a=='rvsv'){const d=ST.rd,tg=[...sheet.querySelectorAll('.gs .chip[aria-pressed=true]')].map(c=>c.textContent),ph=g('.gs .up').classList.contains('on'),o={p:d.p,s:d.s,r:d.r,x:g('#rvx').value.trim(),tg,d:d.i>=0?d.d:'18 Eki 2026',h:d.i>=0?d.h:0};if(!o.r)return;if(d.i>=0)ST.rv[d.i]=o;else{ST.rv.unshift(o);ST.xp+=10+(ph?5:0)}cl();rr();toast(d.i>=0?'Yorumun güncellendi':'Yorumun yayında · +'+(10+(ph?5:0))+' XP')}
});
document.addEventListener('input',e=>{const t=e.target,g=s=>sheet.querySelector(s);
 if(t.id=='edv')g('[data-a="edsv"]').disabled=!t.value.trim();

 else if(a=='fp0'){FP={s:1,id:'',ty:'em'};go('fp')}

 else if(a=='pons'){const n=g('#po-nm').value.trim(),m=g('#po-em').value.trim();if(n)ST.pr.name=n;if(m)ST.pr.email=m;cl();toast('Bilgilerin kaydedildi')}
 else if(a=='man'){ST.mf=1;rr()}
 else if(a=='rs'){ST.rs=v;sheet.querySelectorAll('.pst').forEach(el=>el.setAttribute('aria-checked',String(el.dataset.r==v)));const b=g('#rgo');if(b)b.textContent=v=='c'?'Şef olarak devam et':'Gurme olarak devam et'}
 else if(a=='rgo'){if(ST.rs=='c')go('csu:'+(hasDr()?DR.step:1));else{t.dataset.u='guest';t.click()}}
 else if(a=='dist'){ST.loc=v+', İstanbul';go('market')}

 else if(f=='pw')SM.pw=t.value;

 else DR[f]=t.value;
 dsave();csuRef()});

{const _go=go;go=function(id,keep){_go(id,keep);if(id.split(':')[0]=='csu')csuRef();if(id=='csu:3'&&!DR.acct)smb()}}
